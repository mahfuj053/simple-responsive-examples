<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Collage</title>
    <link rel="stylesheet" href="styles/collage.css">
</head>
<body>
    <header>
        <h1>My Picture Collage</h1>
    </header>
    <section>
        <div class="row">
                <img src="images/A.jpg" alt="Picture 1">
            </div>
            <div class="row">
                <div>
                    <img src="images/B.jpg" alt="Picture 2">
                </div>

                <div>
                    <img src="images/C.jpg" alt="Picture 3">
                </div>

                <div class="vertical-collage">
                      <img src="images/D.jpg" alt="Picture 4">
                      <img src="images/E.jpg" alt="Picture 5">
                </div>
              
            </div>
            <div class="row">
                <div>
                    <img src="images/F.jpg" alt="Picture 6">
                </div>
                
                <div class="square-collage">
                    <img src="images/G.jpg" alt="Picture 7">
                    <img src="images/G.jpg" alt="Picture 7">
                    <img src="images/G.jpg" alt="Picture 7">
                    <img src="images/G.jpg" alt="Picture 7">
                </div>

                <div>
                    <img src="images/H.jpg" alt="Picture 8">
                </div>
            </div>
            
    </section>
    
</body>
</html>
